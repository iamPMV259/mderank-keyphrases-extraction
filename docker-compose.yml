services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mde-rank
    # Restart unless stopped manually
    restart: unless-stopped
    ports:
      - "5040:5040"
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 5040